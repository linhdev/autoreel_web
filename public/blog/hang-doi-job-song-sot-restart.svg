<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" role="img" aria-labelledby="ttl">
  <title id="ttl">Vòng đời hai hàng đợi: job trong lô và bài đã hẹn giờ, cùng chỗ mà một lần khởi động lại chen vào</title>
  <defs>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1,1 L9,5 L1,9 z" fill="#5b78ff"/>
    </marker>
    <marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1,1 L9,5 L1,9 z" fill="#55e6a5"/>
    </marker>
    <marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1,1 L9,5 L1,9 z" fill="#ff7a8a"/>
    </marker>
    <marker id="grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1,1 L9,5 L1,9 z" fill="#8ea0c9"/>
    </marker>
  </defs>

  <rect width="760" height="560" fill="#0b1024"/>
  <rect x="10" y="10" width="740" height="540" rx="14" fill="none" stroke="#2b3557"/>
  <text x="380" y="38" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#8ea0c9">Mỗi nhãn dưới đây là một giá trị nằm trong tệp dữ liệu, không phải thứ giữ trong bộ nhớ.</text>

  <!-- Lane 1: a pooled job -->
  <rect x="24" y="52" width="712" height="204" rx="12" fill="#11172d" stroke="#2b3557"/>
  <text x="44" y="78" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#e7eeff">Một job trong lô</text>

  <rect x="44" y="96" width="130" height="46" rx="9" fill="#151d38" stroke="#3b477a"/>
  <text x="56" y="115" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e7eeff">queued</text>
  <text x="56" y="131" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#8ea0c9">chưa bắt đầu</text>

  <rect x="214" y="96" width="130" height="46" rx="9" fill="#151d38" stroke="#5b78ff"/>
  <text x="226" y="115" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e7eeff">running</text>
  <text x="226" y="131" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#8ea0c9">công nhân đang giữ</text>

  <rect x="392" y="88" width="150" height="44" rx="9" fill="#151d38" stroke="#55e6a5"/>
  <text x="404" y="106" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e7eeff">succeeded</text>
  <text x="404" y="122" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#8ea0c9">đã có tệp</text>

  <rect x="392" y="140" width="150" height="44" rx="9" fill="#151d38" stroke="#ff7a8a"/>
  <text x="404" y="158" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e7eeff">failed</text>
  <text x="404" y="174" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#8ea0c9">không tự chạy lại</text>

  <rect x="392" y="192" width="150" height="44" rx="9" fill="#151d38" stroke="#8ea0c9"/>
  <text x="404" y="210" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e7eeff">cancelled</text>
  <text x="404" y="226" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#8ea0c9">người dùng huỷ</text>

  <!-- restart marker, lane 1 -->
  <rect x="196" y="164" width="166" height="46" rx="9" fill="#1a1430" stroke="#ff7a8a" stroke-dasharray="5 4"/>
  <text x="279" y="183" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#ff7a8a">khởi động lại</text>
  <text x="279" y="199" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#aeb8d4">queued và running → failed</text>

  <!-- lane 1 arrows -->
  <line x1="174" y1="119" x2="208" y2="119" stroke="#5b78ff" stroke-width="1.6" marker-end="url(#blue)"/>
  <line x1="344" y1="112" x2="386" y2="110" stroke="#55e6a5" stroke-width="1.6" marker-end="url(#green)"/>
  <line x1="344" y1="128" x2="386" y2="160" stroke="#ff7a8a" stroke-width="1.6" marker-end="url(#red)"/>
  <path d="M344,136 L368,136 L368,214 L386,214" fill="none" stroke="#8ea0c9" stroke-width="1.6" marker-end="url(#grey)"/>
  <line x1="279" y1="142" x2="279" y2="162" stroke="#ff7a8a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#red)"/>
  <text x="286" y="157" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#ff7a8a">mất điện</text>
  <line x1="362" y1="187" x2="386" y2="173" stroke="#ff7a8a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#red)"/>

  <!-- Lane 2: a scheduled post -->
  <rect x="24" y="272" width="712" height="200" rx="12" fill="#11172d" stroke="#2b3557"/>
  <text x="44" y="298" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#e7eeff">Một bài đã hẹn giờ</text>

  <rect x="44" y="316" width="130" height="46" rx="9" fill="#151d38" stroke="#3b477a"/>
  <text x="56" y="335" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e7eeff">scheduled</text>
  <text x="56" y="351" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#8ea0c9">chưa tới giờ</text>

  <rect x="214" y="316" width="130" height="46" rx="9" fill="#151d38" stroke="#5b78ff"/>
  <text x="226" y="335" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e7eeff">running</text>
  <text x="226" y="351" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#8ea0c9">đang giữ việc</text>

  <rect x="392" y="316" width="150" height="46" rx="9" fill="#151d38" stroke="#55e6a5"/>
  <text x="404" y="335" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e7eeff">done</text>
  <text x="404" y="351" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#8ea0c9">đã đăng</text>

  <rect x="44" y="400" width="130" height="46" rx="9" fill="#151d38" stroke="#8ea0c9" stroke-dasharray="5 4"/>
  <text x="56" y="419" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e7eeff">missed</text>
  <text x="56" y="435" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#8ea0c9">mở muộn quá 30 phút</text>

  <rect x="214" y="400" width="130" height="46" rx="9" fill="#151d38" stroke="#ff7a8a" stroke-dasharray="5 4"/>
  <text x="226" y="419" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e7eeff">interrupted</text>
  <text x="226" y="435" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#8ea0c9">không thử lại</text>

  <rect x="392" y="400" width="150" height="46" rx="9" fill="#151d38" stroke="#ff7a8a"/>
  <text x="404" y="419" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e7eeff">failed</text>
  <text x="404" y="435" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#8ea0c9">hết lượt thử</text>

  <!-- lane 2 arrows -->
  <line x1="174" y1="339" x2="208" y2="339" stroke="#5b78ff" stroke-width="1.6" marker-end="url(#blue)"/>
  <line x1="344" y1="339" x2="386" y2="339" stroke="#55e6a5" stroke-width="1.6" marker-end="url(#green)"/>
  <line x1="109" y1="362" x2="109" y2="396" stroke="#8ea0c9" stroke-width="1.6" marker-end="url(#grey)"/>
  <text x="118" y="383" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#8ea0c9">quá hạn</text>
  <line x1="279" y1="362" x2="279" y2="396" stroke="#ff7a8a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#red)"/>
  <text x="286" y="383" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#ff7a8a">mất điện</text>
  <line x1="344" y1="350" x2="386" y2="414" stroke="#ff7a8a" stroke-width="1.6" marker-end="url(#red)"/>

  <text x="44" y="462" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#8ea0c9">Dòng còn scheduled vẫn chạy khi tới giờ; chỉ dòng đã bị nhận mới ngừng.</text>

  <!-- Bottom rule -->
  <rect x="24" y="484" width="712" height="36" rx="9" fill="#0f1730" stroke="#2b3557" stroke-dasharray="4 4"/>
  <text x="380" y="507" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#aeb8d4">Đăng lại một video đã đăng tệ hơn bỏ một bài — nên “interrupted” không tự thử lại.</text>
</svg>
