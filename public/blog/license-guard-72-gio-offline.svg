<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" role="img" aria-labelledby="ttl">
<title id="ttl">Bản quyền: kích hoạt một lần, kiểm tra chữ ký tại máy, hạn 72 giờ offline và cổng chặn công việc</title>
<rect x="0" y="0" width="760" height="560" fill="#0b1024"/>
<rect x="10" y="10" width="740" height="540" rx="14" fill="none" stroke="#2b3557"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#5b78ff"/></marker>
<marker id="arrowSoft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#55e6a5"/></marker>
<marker id="arrowBad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#ff7a8a"/></marker>
<marker id="arrowCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#37d9ff"/></marker>
</defs>
<text x="380" y="27" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#e7eeff" text-anchor="middle">Bản quyền: kích hoạt một lần, kiểm tra tại máy</text>
<line x1="382" y1="44" x2="382" y2="330" stroke="#2b3557" stroke-width="1.2" stroke-dasharray="6 6"/>
<text x="44" y="54" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#55e6a5">Kích hoạt — một lần</text>
<g fill="#151d38">
<rect x="44" y="64" width="280" height="40" rx="9" stroke="#3b477a" stroke-width="1.4"/>
<rect x="44" y="122" width="280" height="40" rx="9" stroke="#3b477a" stroke-width="1.4"/>
<rect x="44" y="180" width="280" height="40" rx="9" stroke="#55e6a5" stroke-width="1.4"/>
<rect x="44" y="238" width="280" height="42" rx="9" stroke="#3b477a" stroke-width="1.4"/>
</g>
<text x="184" y="81" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#e7eeff" text-anchor="middle">Mã kích hoạt</text>
<text x="184" y="97" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#aeb8d4" text-anchor="middle">mã + mã máy + phiên bản</text>
<text x="184" y="139" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#e7eeff" text-anchor="middle">Máy chủ bản quyền</text>
<text x="184" y="155" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#aeb8d4" text-anchor="middle">kiểm tra, cấp thiết bị</text>
<text x="184" y="197" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#e7eeff" text-anchor="middle">Token đã ký Ed25519</text>
<text x="184" y="213" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#aeb8d4" text-anchor="middle">gói · quyền · hạn · mã máy</text>
<text x="184" y="255" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#e7eeff" text-anchor="middle">Tệp trên máy</text>
<text x="184" y="271" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#aeb8d4" text-anchor="middle">đọc được khi không có mạng</text>
<path d="M184 104V120M184 162V178M184 220V236" stroke="#5b78ff" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="196" y="117" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#aeb8d4">gửi</text>
<text x="196" y="175" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#aeb8d4">trả token</text>
<text x="196" y="233" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#aeb8d4">lưu</text>
<text x="404" y="54" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#37d9ff">Mỗi lần bắt đầu việc</text>
<g fill="#151d38">
<rect x="404" y="64" width="280" height="40" rx="9" stroke="#3b477a" stroke-width="1.4"/>
<rect x="404" y="122" width="280" height="40" rx="9" stroke="#3b477a" stroke-width="1.4"/>
<rect x="404" y="180" width="280" height="40" rx="9" stroke="#3b477a" stroke-width="1.4"/>
<rect x="404" y="238" width="280" height="36" rx="9" stroke="#55e6a5" stroke-width="1.5"/>
<rect x="404" y="292" width="132" height="28" rx="7" stroke="#55e6a5" stroke-width="1.3"/>
<rect x="552" y="292" width="132" height="28" rx="7" stroke="#ff7a8a" stroke-width="1.3"/>
</g>
<text x="544" y="81" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#e7eeff" text-anchor="middle">Job hoặc nút bấm</text>
<text x="544" y="97" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#aeb8d4" text-anchor="middle">không qua màn hình</text>
<text x="544" y="139" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#e7eeff" text-anchor="middle">Cổng kiểm tra</text>
<text x="544" y="155" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#aeb8d4" text-anchor="middle">guard.require(feature)</text>
<text x="544" y="197" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#e7eeff" text-anchor="middle">Kiểm tra tại máy</text>
<text x="544" y="213" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#aeb8d4" text-anchor="middle">chữ ký · hạn · đúng máy</text>
<text x="544" y="261" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#e7eeff" text-anchor="middle">Còn hạn và đúng máy?</text>
<path d="M544 104V120M544 162V178M544 220V236" stroke="#5b78ff" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<path d="M544 274V284H470V290M544 274V284H618V290" stroke="#5b78ff" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="500" y="281" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#55e6a5" text-anchor="middle">có</text>
<text x="588" y="281" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#ff7a8a" text-anchor="middle">không</text>
<text x="470" y="310" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#55e6a5" text-anchor="middle">mở chức năng</text>
<text x="618" y="310" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#ff7a8a" text-anchor="middle">từ chối + một câu</text>
<rect x="28" y="336" width="704" height="120" rx="10" fill="#11172d" stroke="#3b477a" stroke-width="1.3"/>
<text x="44" y="358" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#9b5cff">72 giờ nằm trong chữ ký, không trong đồng hồ máy</text>
<path d="M60 396H700" stroke="#3b477a" stroke-width="1.2" fill="none"/>
<path d="M60 396H520" stroke="#55e6a5" stroke-width="6" fill="none"/>
<path d="M520 396H700" stroke="#ff7a8a" stroke-width="6" fill="none"/>
<path d="M60 388V404M250 388V404M520 388V404M690 388V404" stroke="#aeb8d4" stroke-width="1.2"/>
<text x="44" y="382" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e7eeff">kích hoạt</text>
<text x="250" y="382" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e7eeff" text-anchor="middle">xin làm mới ~19 giờ</text>
<text x="520" y="382" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e7eeff" text-anchor="middle">hết hạn 72 giờ</text>
<text x="690" y="382" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e7eeff" text-anchor="end">cần mạng</text>
<text x="290" y="424" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55e6a5" text-anchor="middle">vẫn dựng bình thường</text>
<text x="610" y="424" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#ff7a8a" text-anchor="middle">từ chối, xin kết nối</text>
<text x="380" y="444" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#aeb8d4" text-anchor="middle">lùi đồng hồ quá 6 giờ → từ chối</text>
<rect x="28" y="470" width="704" height="64" rx="10" fill="#11172d" stroke="#2b3557" stroke-width="1.3"/>
<text x="44" y="494" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#e7eeff">Chỉ token đi ra ngoài: mã, mã máy, phiên bản.</text>
<text x="44" y="516" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#aeb8d4">Video, lời thoại, dữ liệu sản phẩm ở lại. Máy chủ chỉ giữ HMAC của mã.</text>
</svg>
