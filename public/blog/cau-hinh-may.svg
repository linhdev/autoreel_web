<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="ttl">
<title id="ttl">Ba mức cấu hình máy, và số việc chạy cùng lúc ở mỗi mức</title>
<rect x="0" y="0" width="760" height="400" fill="#0b1024"/>
<rect x="10" y="10" width="740" height="380" rx="14" fill="none" stroke="#2b3557"/>
<text x="380" y="52" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#e7eeff" text-anchor="middle">Ba mức cấu hình, và số việc chạy cùng lúc</text>

<rect x="30" y="84" width="210" height="204" rx="12" fill="#151d38" stroke="#3b477a"/>
<text x="135" y="118" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" letter-spacing="1.2" fill="#8ea0c9" text-anchor="middle">TỐI THIỂU</text>
<text x="135" y="162" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="23" font-weight="700" fill="#e7eeff" text-anchor="middle">4 nhân</text>
<text x="135" y="188" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#aeb8d4" text-anchor="middle">8 GB RAM</text>
<line x1="77" y1="208" x2="193" y2="208" stroke="#2b3557"/>
<text x="135" y="248" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="27" font-weight="800" fill="#8ea0c9" text-anchor="middle">1 việc</text>
<text x="135" y="270" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#8ea0c9" text-anchor="middle">cùng lúc</text>

<rect x="275" y="84" width="210" height="204" rx="12" fill="#151d38" stroke="#5b78ff"/>
<text x="380" y="118" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" letter-spacing="1.2" fill="#5b78ff" text-anchor="middle">NÊN CÓ</text>
<text x="380" y="162" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="23" font-weight="700" fill="#e7eeff" text-anchor="middle">8 nhân</text>
<text x="380" y="188" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#aeb8d4" text-anchor="middle">16 GB RAM</text>
<line x1="322" y1="208" x2="438" y2="208" stroke="#2b3557"/>
<text x="380" y="248" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="27" font-weight="800" fill="#5b78ff" text-anchor="middle">2 việc</text>
<text x="380" y="270" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#8ea0c9" text-anchor="middle">cùng lúc</text>

<rect x="520" y="84" width="210" height="204" rx="12" fill="#151d38" stroke="#55e6a5"/>
<text x="625" y="118" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" letter-spacing="1.2" fill="#55e6a5" text-anchor="middle">LÀM SỐ LƯỢNG</text>
<text x="625" y="162" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="23" font-weight="700" fill="#e7eeff" text-anchor="middle">12 luồng</text>
<text x="625" y="188" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#aeb8d4" text-anchor="middle">32 GB RAM</text>
<line x1="567" y1="208" x2="683" y2="208" stroke="#2b3557"/>
<text x="625" y="248" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="27" font-weight="800" fill="#55e6a5" text-anchor="middle">4 việc</text>
<text x="625" y="270" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#8ea0c9" text-anchor="middle">cùng lúc</text>

<rect x="30" y="310" width="700" height="62" rx="10" fill="#11172d" stroke="#2b3557"/>
<text x="380" y="336" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#e7eeff" text-anchor="middle">Cứ 3 nhân CPU và 3 GB RAM còn trống thì chạy thêm được một việc</text>
<text x="380" y="358" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#8ea0c9" text-anchor="middle">Trần là 8 việc cùng lúc — thêm nữa không còn đáng tiền</text>
</svg>
