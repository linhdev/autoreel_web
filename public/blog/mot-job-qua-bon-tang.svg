<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-labelledby="ttl">
<title id="ttl">Một job đi qua bốn tầng: giao diện, điều phối, engine, dữ liệu; chỉ hai đường ra ngoài internet</title>
<defs>
  <marker id="down" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#37d9ff"/>
  </marker>
  <marker id="out" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#55e6a5"/>
  </marker>
</defs>
<rect x="0" y="0" width="760" height="430" fill="#0b1024"/>
<rect x="10" y="10" width="740" height="410" rx="14" fill="none" stroke="#2b3557"/>

<!-- The four layers, top to bottom. Each one is a box rather than a call graph:
     what the picture has to say is that a job only ever moves down, and that
     only two of the four have a door to the outside. -->
<rect x="40" y="52" width="420" height="54" rx="10" fill="#11172d" stroke="#2b3557"/>
<text x="60" y="76" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#e7eeff">Giao diện</text>
<text x="60" y="94" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#8ea0c9">thu lựa chọn, vẽ trạng thái, không giữ sự thật nào</text>

<rect x="40" y="126" width="420" height="54" rx="10" fill="#11172d" stroke="#5b78ff" stroke-width="1.4"/>
<text x="60" y="150" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#e7eeff">Điều phối &#183; Python</text>
<text x="60" y="168" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#8ea0c9">thứ tự bước, thử lại, các phép kiểm tra</text>

<rect x="40" y="200" width="420" height="54" rx="10" fill="#11172d" stroke="#2b3557"/>
<text x="60" y="224" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#e7eeff">Engine</text>
<text x="60" y="242" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#8ea0c9">mỗi việc nặng một engine, cùng một hình dạng vào ra</text>

<rect x="40" y="274" width="420" height="54" rx="10" fill="#11172d" stroke="#2b3557"/>
<text x="60" y="298" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#e7eeff">Dữ liệu</text>
<text x="60" y="316" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#8ea0c9">một tệp trên máy bạn: job, trạng thái, thư viện</text>

<!-- The job itself, going down, never back up. -->
<path d="M250 106 L250 126" stroke="#37d9ff" stroke-width="1.6" marker-end="url(#down)"/>
<path d="M250 180 L250 200" stroke="#37d9ff" stroke-width="1.6" marker-end="url(#down)"/>
<path d="M250 254 L250 274" stroke="#37d9ff" stroke-width="1.6" marker-end="url(#down)"/>
<text x="264" y="120" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#37d9ff">job đi xuống</text>

<!-- The only two doors out, and both belong to a layer that is allowed to
     talk to the internet; the other two have none. -->
<rect x="536" y="88" width="184" height="192" rx="12" fill="none" stroke="#2b3557"/>
<text x="628" y="112" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#8ea0c9" text-anchor="middle">ra ngoài internet</text>

<rect x="552" y="126" width="152" height="54" rx="10" fill="#11172d" stroke="#55e6a5" stroke-width="1.3"/>
<text x="628" y="150" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#55e6a5" text-anchor="middle">Viết kịch bản</text>
<text x="628" y="166" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#8ea0c9" text-anchor="middle">vào: dữ liệu thật &#183; ra: JSON</text>
<path d="M460 153 L552 153" stroke="#55e6a5" stroke-width="1.4" marker-end="url(#out)"/>

<rect x="552" y="200" width="152" height="54" rx="10" fill="#11172d" stroke="#55e6a5" stroke-width="1.3"/>
<text x="628" y="224" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#55e6a5" text-anchor="middle">Tìm tư liệu</text>
<text x="628" y="240" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#8ea0c9" text-anchor="middle">vào: từ khoá &#183; ra: hình</text>
<path d="M460 227 L552 227" stroke="#55e6a5" stroke-width="1.4" marker-end="url(#out)"/>

<rect x="40" y="352" width="680" height="48" rx="10" fill="#11172d" stroke="#55e6a5" stroke-width="1.2"/>
<text x="380" y="381" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#55e6a5" text-anchor="middle">hai chỗ gọi ra ngoài, và cả hai đều chỉ để mô hình đổi ý thành chữ</text>
</svg>
