<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" role="img" aria-labelledby="ttl">
<title id="ttl">The pipeline for one 9:16 video: six stages, the clip cache, the GPU and the QC gate</title>
<rect x="0" y="0" width="760" height="560" fill="#0b1024"/>
<rect x="10" y="10" width="740" height="540" rx="14" fill="none" stroke="#2b3557"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#5b78ff"/></marker>
<marker id="arrowSoft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#55e6a5"/></marker>
<marker id="arrowBad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#ff7a8a"/></marker>
</defs>
<text x="380" y="27" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#e7eeff" text-anchor="middle">One 9:16 video: six stages, two places it breaks</text>
<g fill="#151d38">
<rect x="28" y="46" width="104" height="54" rx="10" stroke="#3b477a" stroke-width="1.4"/>
<rect x="148" y="46" width="104" height="54" rx="10" stroke="#5b78ff" stroke-width="1.6"/>
<rect x="268" y="46" width="104" height="54" rx="10" stroke="#9b5cff" stroke-width="1.6"/>
<rect x="388" y="46" width="104" height="54" rx="10" stroke="#37d9ff" stroke-width="1.6"/>
<rect x="508" y="46" width="104" height="54" rx="10" stroke="#55e6a5" stroke-width="1.6"/>
<rect x="628" y="46" width="104" height="54" rx="10" stroke="#ff7a8a" stroke-width="1.6"/>
</g>
<text x="80" y="69" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#e7eeff" text-anchor="middle">Source</text>
<text x="80" y="87" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#aeb8d4" text-anchor="middle">fetch</text>
<text x="200" y="69" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#e7eeff" text-anchor="middle">Cut</text>
<text x="200" y="87" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#aeb8d4" text-anchor="middle">45 s · 9:16</text>
<text x="320" y="69" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#e7eeff" text-anchor="middle">Voice</text>
<text x="320" y="87" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#aeb8d4" text-anchor="middle">8 + 25 voices</text>
<text x="440" y="69" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#e7eeff" text-anchor="middle">Subtitles</text>
<text x="440" y="87" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#aeb8d4" text-anchor="middle">burned in</text>
<text x="560" y="69" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#e7eeff" text-anchor="middle">Branding</text>
<text x="560" y="87" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#aeb8d4" text-anchor="middle">frame + logo</text>
<text x="680" y="69" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#e7eeff" text-anchor="middle">Check</text>
<text x="680" y="87" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#aeb8d4" text-anchor="middle">final gate</text>
<path d="M132 73H144M252 73H264M372 73H384M492 73H504M612 73H624" stroke="#5b78ff" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<rect x="28" y="122" width="344" height="148" rx="10" fill="#11172d" stroke="#3b477a" stroke-width="1.3"/>
<text x="44" y="144" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#55e6a5">Shared stills → one clip</text>
<g fill="#151d38">
<rect x="44" y="154" width="84" height="26" rx="7" stroke="#3b477a" stroke-width="1.2"/>
<rect x="140" y="154" width="100" height="26" rx="7" stroke="#3b477a" stroke-width="1.2"/>
<rect x="252" y="154" width="104" height="26" rx="7" stroke="#55e6a5" stroke-width="1.2"/>
</g>
<text x="86" y="171" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e7eeff" text-anchor="middle">image</text>
<text x="190" y="171" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e7eeff" text-anchor="middle">hidden temp</text>
<text x="304" y="171" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e7eeff" text-anchor="middle">target .mp4</text>
<path d="M128 167H138M240 167H250" stroke="#55e6a5" stroke-width="1.4" fill="none" marker-end="url(#arrowSoft)"/>
<text x="44" y="202" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#aeb8d4">• one lock per target</text>
<text x="44" y="221" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#aeb8d4">• one rename, never half a file</text>
<text x="44" y="240" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#aeb8d4">• 5 jobs · 3 stills → 1 render</text>
<rect x="388" y="122" width="344" height="148" rx="10" fill="#11172d" stroke="#3b477a" stroke-width="1.3"/>
<text x="404" y="144" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#37d9ff">Container gets the card</text>
<g fill="#151d38">
<rect x="404" y="154" width="84" height="26" rx="7" stroke="#3b477a" stroke-width="1.2"/>
<rect x="500" y="154" width="88" height="26" rx="7" stroke="#3b477a" stroke-width="1.2"/>
<rect x="600" y="154" width="116" height="26" rx="7" stroke="#ff7a8a" stroke-width="1.2"/>
</g>
<text x="446" y="171" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e7eeff" text-anchor="middle">device</text>
<text x="544" y="171" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e7eeff" text-anchor="middle">nvenc</text>
<text x="658" y="171" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e7eeff" text-anchor="middle">libx264 fallback</text>
<path d="M488 167H498" stroke="#55e6a5" stroke-width="1.4" fill="none" marker-end="url(#arrowSoft)"/>
<path d="M588 167H598" stroke="#ff7a8a" stroke-width="1.4" stroke-dasharray="4 4" fill="none" marker-end="url(#arrowBad)"/>
<text x="404" y="202" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#aeb8d4">• needs gpu + video</text>
<text x="404" y="221" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#aeb8d4">• 12 sessions per card</text>
<text x="404" y="240" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#aeb8d4">• 8 workers per task</text>
<rect x="28" y="284" width="704" height="176" rx="10" fill="#11172d" stroke="#3b477a" stroke-width="1.3"/>
<text x="44" y="306" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#9b5cff">The gate reads the file, not the mood</text>
<g fill="#151d38">
<rect x="44" y="318" width="140" height="30" rx="7" stroke="#3b477a" stroke-width="1.2"/>
<rect x="194" y="318" width="140" height="30" rx="7" stroke="#3b477a" stroke-width="1.2"/>
<rect x="344" y="318" width="140" height="30" rx="7" stroke="#3b477a" stroke-width="1.2"/>
<rect x="494" y="318" width="222" height="30" rx="7" stroke="#ff7a8a" stroke-width="1.2"/>
<rect x="44" y="358" width="190" height="30" rx="7" stroke="#ff7a8a" stroke-width="1.2"/>
<rect x="244" y="358" width="150" height="30" rx="7" stroke="#3b477a" stroke-width="1.2"/>
<rect x="404" y="358" width="190" height="30" rx="7" stroke="#3b477a" stroke-width="1.2"/>
<rect x="604" y="358" width="112" height="30" rx="7" stroke="#3b477a" stroke-width="1.2"/>
</g>
<text x="114" y="337" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#e7eeff" text-anchor="middle">9:16 ± 0.02</text>
<text x="264" y="337" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#e7eeff" text-anchor="middle">2–90 seconds</text>
<text x="414" y="337" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#e7eeff" text-anchor="middle">audio stream</text>
<text x="605" y="337" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#e7eeff" text-anchor="middle">black &gt; 50% → reject</text>
<text x="139" y="377" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#e7eeff" text-anchor="middle">same hash → reject</text>
<text x="319" y="377" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#e7eeff" text-anchor="middle">source rights</text>
<text x="499" y="377" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#e7eeff" text-anchor="middle">no subtitles = warning</text>
<text x="660" y="377" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#e7eeff" text-anchor="middle">posting comes later</text>
<text x="44" y="418" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#aeb8d4">The gate answers pass or fail with a reason — no model takes part.</text>
<text x="44" y="440" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#aeb8d4">A 15-second video and a 5-minute video fail at different stages.</text>
<rect x="140" y="494" width="480" height="34" rx="10" fill="#11172d" stroke="#2b3557" stroke-width="1.4"/>
<text x="380" y="516" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#aeb8d4" text-anchor="middle">Voice is the slow CPU stage · the card only helps encoding</text>
</svg>
