<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520" role="img" aria-labelledby="ttl">
  <title id="ttl">Sơ đồ kiến trúc một máy: mọi thành phần chạy trên máy người dùng, chỉ có năm đường ra internet</title>
  <defs>
    <marker id="in" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M9,1 L1,5 L9,9 z" fill="#55e6a5"/>
    </marker>
    <marker id="out-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1,1 L9,5 L1,9 z" fill="#9b5cff"/>
    </marker>
    <marker id="out-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1,1 L9,5 L1,9 z" fill="#5b78ff"/>
    </marker>
    <marker id="out-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1,1 L9,5 L1,9 z" fill="#37d9ff"/>
    </marker>
    <marker id="out-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1,1 L9,5 L1,9 z" fill="#55e6a5"/>
    </marker>
  </defs>

  <rect width="760" height="520" fill="#0b1024"/>
  <rect x="10" y="10" width="740" height="500" rx="14" fill="none" stroke="#2b3557"/>

  <!-- The machine -->
  <rect x="16" y="40" width="470" height="440" rx="12" fill="#11172d" stroke="#3b477a"/>
  <text x="36" y="66" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700" fill="#e7eeff">Máy của bạn</text>
  <text x="486" y="66" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#8ea0c9">một ổ đĩa · một hàng đợi</text>

  <!-- Row 1 -->
  <rect x="36" y="80" width="204" height="54" rx="9" fill="#151d38" stroke="#3b477a"/>
  <text x="50" y="104" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#e7eeff">Giao diện</text>
  <text x="50" y="121" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#aeb8d4">thu lựa chọn · vẽ lại trạng thái</text>

  <rect x="252" y="80" width="214" height="54" rx="9" fill="#151d38" stroke="#5b78ff"/>
  <text x="266" y="104" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#e7eeff">Bộ điều phối · Python</text>
  <text x="266" y="121" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#aeb8d4">thứ tự · thử lại · gọi ra ngoài</text>

  <!-- Row 2 -->
  <rect x="36" y="158" width="204" height="54" rx="9" fill="#151d38" stroke="#37d9ff"/>
  <text x="50" y="182" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#e7eeff">Engine</text>
  <text x="50" y="199" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#aeb8d4">giọng đọc · dựng hình · phụ đề</text>

  <rect x="252" y="158" width="214" height="54" rx="9" fill="#151d38" stroke="#55e6a5"/>
  <text x="266" y="182" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#e7eeff">Một tệp dữ liệu</text>
  <text x="266" y="199" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#aeb8d4">job · thư viện · lịch đăng</text>

  <!-- Row 3 -->
  <rect x="36" y="236" width="204" height="54" rx="9" fill="#151d38" stroke="#9b5cff"/>
  <text x="50" y="260" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#e7eeff">Bộ kiểm bản quyền</text>
  <text x="50" y="277" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#aeb8d4">hỏi trước khi bắt đầu</text>

  <rect x="252" y="236" width="214" height="54" rx="9" fill="#151d38" stroke="#3b477a"/>
  <text x="266" y="260" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#e7eeff">Bot Telegram</text>
  <text x="266" y="277" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#aeb8d4">tiến trình thứ hai · cùng tệp</text>

  <!-- Row 4: Chrome -->
  <rect x="36" y="314" width="430" height="54" rx="9" fill="#151d38" stroke="#37d9ff"/>
  <text x="50" y="338" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#e7eeff">Chrome của bạn</text>
  <text x="50" y="355" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#aeb8d4">hai cửa sổ: Douyin 47832 · Shopee 47831 — chỉ mở khi bạn mở</text>

  <!-- Truth strip -->
  <rect x="36" y="392" width="430" height="56" rx="9" fill="#0f1730" stroke="#2b3557" stroke-dasharray="4 4"/>
  <text x="52" y="415" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#55e6a5">Chỉ một tệp giữ sự thật.</text>
  <text x="52" y="433" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#aeb8d4">Đóng tab, tải lại trang, mở cửa sổ khác — không mất dòng nào.</text>

  <!-- Outside: the five roads -->
  <rect x="548" y="80" width="192" height="58" rx="9" fill="#151d38" stroke="#55e6a5"/>
  <text x="562" y="104" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#e7eeff">Nền tảng nguồn</text>
  <text x="562" y="121" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#aeb8d4">sáu nền tảng · tải tệp về</text>

  <rect x="548" y="158" width="192" height="58" rx="9" fill="#151d38" stroke="#9b5cff"/>
  <text x="562" y="182" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#e7eeff">Mô hình AI bạn chọn</text>
  <text x="562" y="199" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#aeb8d4">nhận lời thoại cần dịch</text>

  <rect x="548" y="236" width="192" height="58" rx="9" fill="#151d38" stroke="#5b78ff"/>
  <text x="562" y="260" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#e7eeff">Facebook · Page</text>
  <text x="562" y="277" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#aeb8d4">chỉ khi bật đăng thật</text>

  <rect x="548" y="314" width="192" height="58" rx="9" fill="#151d38" stroke="#37d9ff"/>
  <text x="562" y="338" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#e7eeff">Máy chủ bản quyền</text>
  <text x="562" y="355" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#aeb8d4">cấp token đã ký</text>

  <rect x="548" y="392" width="192" height="58" rx="9" fill="#151d38" stroke="#55e6a5"/>
  <text x="562" y="416" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#e7eeff">Telegram Bot API</text>
  <text x="562" y="433" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#aeb8d4">lệnh từ điện thoại</text>

  <!-- Arrows across the boundary -->
  <line x1="548" y1="109" x2="490" y2="109" stroke="#55e6a5" stroke-width="1.6" marker-end="url(#in)"/>
  <line x1="486" y1="187" x2="544" y2="187" stroke="#9b5cff" stroke-width="1.6" marker-end="url(#out-a)"/>
  <line x1="486" y1="265" x2="544" y2="265" stroke="#5b78ff" stroke-width="1.6" marker-end="url(#out-b)"/>
  <line x1="486" y1="343" x2="544" y2="343" stroke="#37d9ff" stroke-width="1.6" marker-end="url(#out-c)"/>
  <line x1="486" y1="421" x2="544" y2="421" stroke="#55e6a5" stroke-width="1.6" marker-end="url(#out-d)"/>

  <text x="380" y="500" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#8ea0c9">Không có máy chủ nào ở giữa bạn và năm đường đó.</text>
</svg>
