<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070B1A" />

    <title>AutoReel - AI Content Automation | Tạo và đăng video tự động</title>
    <meta
      name="description"
      content="AutoReel giúp Affiliate và Creator tạo, xử lý và đăng video tự động lên Shopee và Facebook/Reels trong một workflow."
    />
    <link rel="canonical" href="https://autoreelvn.com/" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="AutoReel" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AutoReel" />
    <meta property="og:locale" content="vi_VN" />
    <meta property="og:url" content="https://autoreelvn.com/" />
    <meta
      property="og:title"
      content="AutoReel - AI Content Automation | Tạo và đăng video tự động"
    />
    <meta
      property="og:description"
      content="Biến sản phẩm, video có sẵn hoặc ý tưởng thành nội dung hoàn chỉnh và tự động đăng lên Shopee, Facebook/Reels chỉ trong một workflow."
    />
    <meta property="og:image" content="https://autoreelvn.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="AutoReel — AI Content Automation" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="AutoReel - AI Content Automation | Tạo và đăng video tự động"
    />
    <meta
      name="twitter:description"
      content="Tạo video hàng loạt. Xử lý tự động. Đăng thẳng lên nền tảng."
    />
    <meta name="twitter:image" content="https://autoreelvn.com/og-image.png" />

    <!-- Icons -->
    <!-- Only the 32px icon is declared as rel="icon": declaring the 192px one
         too makes some browsers pull the much larger PNG on first paint.
         The 192px and 180px icons are used from the web manifest instead. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Fonts: preconnect + swap keeps first paint fast -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400..900&display=swap"
    />

    <!-- Paint the dark base before CSS loads (no white flash) -->
    <style>
      html,
      body {
        margin: 0;
        background: #070b1a;
        color: #f8faff;
      }
    </style>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "AutoReel",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Windows, macOS",
        "description": "AutoReel giúp Affiliate và Creator tạo, xử lý và đăng video tự động lên Shopee và Facebook/Reels trong một workflow.",
        "url": "https://autoreelvn.com/",
        "offers": [
          {
            "@type": "Offer",
            "name": "Personal",
            "price": "1490000",
            "priceCurrency": "VND"
          },
          {
            "@type": "Offer",
            "name": "Team",
            "price": "3990000",
            "priceCurrency": "VND"
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
